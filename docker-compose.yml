services:
  database:
    image: postgres:17-alpine
    container_name: panaderia-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panaderia}
      POSTGRES_USER: ${POSTGRES_USER:-panaderia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panaderia_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panaderia_user} -d ${POSTGRES_DB:-panaderia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: panaderia-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://panaderia_user:panaderia_password@database:5432/panaderia?schema=public}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: panaderia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: panaderia_postgres_data

